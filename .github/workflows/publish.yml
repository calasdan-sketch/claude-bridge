name: Publish to npm

# Push a tag like v1.1.0 and GitHub publishes that version to npm.
# Uses npm "trusted publishing": GitHub proves who it is to npm directly,
# so no password, token or emailed code is ever needed.
# One-time setup on npmjs.com: package onememory-mcp -> Settings ->
# Trusted Publisher -> GitHub Actions, repo calasdan-sketch/onememory,
# workflow file publish.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json $v"; exit 1; }
      - run: npm publish --provenance --access public
